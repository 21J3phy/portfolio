<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>model preview</title>
<!--
  Dev harness for room/models/*.js.
  http://localhost:8917/room/dev/preview.html?m=robot&yaw=35&pitch=18&zoom=1
  Renders the model's default export on a studio floor, auto-framed, with triangle / draw-call stats.
  document.title becomes "ready" once the frame is drawn (for headless screenshots).
-->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #a8abb1; }
  canvas { display: block; }
  #stats { position: fixed; left: 12px; top: 10px; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "../../vendor/three/three.module.js", "three/addons/": "../../vendor/three/addons/" } }
</script>
</head>
<body>
<div id="stats"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { triangles } from '../models/kit.js';

const q = new URLSearchParams(location.search);
const name = q.get('m') || 'robot';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xfff1e0, 2.2); key.position.set(2.5, 4, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fcfff, 0.8); rim.position.set(-3, 2, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(10, 20, 0x2a2e35, 0x1d2026); grid.position.y = 0.001; scene.add(grid);

const mod = await import('../models/' + name + '.js');
const model = await (mod.default || mod.create)();
scene.add(model);

const bb = new THREE.Box3().setFromObject(model), size = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
const r = size.length() / 2;
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
const yaw = THREE.MathUtils.degToRad(+(q.get('yaw') ?? 35)), pitch = THREE.MathUtils.degToRad(+(q.get('pitch') ?? 18));
const dist = r / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)) * 0.95 / (+(q.get('zoom') || 1));
cam.position.set(c.x + dist * Math.sin(yaw) * Math.cos(pitch), c.y + dist * Math.sin(pitch), c.z + dist * Math.cos(yaw) * Math.cos(pitch));
key.target.position.copy(c); scene.add(key.target);
key.shadow.camera.left = key.shadow.camera.bottom = -r * 1.5; key.shadow.camera.right = key.shadow.camera.top = r * 1.5; key.shadow.camera.far = 30;
const controls = new OrbitControls(cam, renderer.domElement); controls.target.copy(c); controls.update();

let meshes = 0; model.traverse(o => { if (o.isMesh) meshes++; });
document.getElementById('stats').textContent =
  name + '\nsize  ' + size.toArray().map(v => v.toFixed(3)).join(' × ') + ' m\ntris  ' + triangles(model) + '\ndraws ' + meshes;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, cam); });
requestAnimationFrame(() => requestAnimationFrame(() => { document.title = 'ready'; }));
</script>
</body>
</html>
