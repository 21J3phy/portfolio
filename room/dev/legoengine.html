<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="robots" content="noindex">
<title>LEGO engine · linkage inspection</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e4e1d9;color:#282925;font:12px/1.45 ui-monospace,monospace}canvas{display:block}aside{position:fixed;left:16px;top:16px;background:#fffdf2e8;padding:16px;width:300px;border:1px solid #ccc8bc;border-radius:8px}h1{font:600 16px system-ui;margin:0 0 8px}input[type=range]{width:100%}button{padding:6px 10px;cursor:pointer}pre{white-space:pre-wrap;font-size:11px}label{display:block;margin:8px 0}#error{color:#a21a0a}
</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script>
<aside><h1>LEGO vacuum engine</h1><label>Crank angle <output id="angle">32°</output><input id="crank" type="range" min="0" max="360" step="0.25" value="31.5"></label><button id="play">Play</button> <button id="focus">Engine / whole setup</button><label><input id="cutaway" type="checkbox"> Hide opaque shell for linkage QA</label><pre id="stats"></pre><div id="error"></div><small>16 mm stroke / 32 mm bore are inferred.<br>90° timing is supplied by Nirav.</small></aside>
<script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import create,{setCrank,CYCLE} from '../models/legoengine.js';
import {triangles} from '../models/kit.js';
const errors=[]; addEventListener('error',e=>{errors.push(e.message);document.querySelector('#error').textContent=e.message});
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.NeutralToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFShadowMap;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xe6e3dc);
const pmrem=new T.PMREMGenerator(renderer),env=new RoomEnvironment();scene.environment=pmrem.fromScene(env,.04).texture;scene.environmentIntensity=.75;env.dispose();pmrem.dispose();
const key=new T.DirectionalLight(0xffead4,2.5);key.position.set(.6,1,.8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-.4,right:.4,top:.4,bottom:-.4,near:.01,far:3});key.shadow.bias=-.00005;key.shadow.normalBias=.00015;scene.add(key);
const fill=new T.DirectionalLight(0xd5e7ff,.7);fill.position.set(-1,.5,-.8);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(6,6),new T.MeshStandardMaterial({color:0xd8d3c9,roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.0002;floor.receiveShadow=true;scene.add(floor);
const model=create();scene.add(model);const engine=model.getObjectByName('engine');
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.001,10);const controls=new OrbitControls(camera,renderer.domElement);controls.minDistance=.07;controls.maxDistance=2;
const q=new URLSearchParams(location.search);let detail=q.get('whole')!=='1';
function frame(){const bb=new T.Box3().setFromObject(detail?engine:model,true),c=bb.getCenter(new T.Vector3()),r=bb.getSize(new T.Vector3()).length()/2;const d=r/Math.sin(camera.fov*Math.PI/360)*.95/(+(q.get('zoom')||1));const yaw=+(q.get('yaw')??25)*Math.PI/180,pitch=+(q.get('pitch')??22)*Math.PI/180;camera.position.set(c.x+d*Math.sin(yaw)*Math.cos(pitch),c.y+d*Math.sin(pitch),c.z+d*Math.cos(yaw)*Math.cos(pitch));controls.target.copy(c);controls.update();}
if(q.has('clean'))document.querySelector('aside').style.display='none';
frame();let play=false,theta=+(q.get('theta')??1.3);const slider=document.querySelector('#crank');
function pose(t){theta=t;setCrank(model,t);model.updateMatrixWorld(true);slider.value=((t*180/Math.PI)%360+360)%360;document.querySelector('#angle').textContent=(+slider.value).toFixed(1)+'°';}
pose(theta);slider.oninput=()=>{play=false;document.querySelector('#play').textContent='Play';pose(+slider.value*Math.PI/180)};
document.querySelector('#play').onclick=e=>{play=!play;e.target.textContent=play?'Pause':'Play'};
document.querySelector('#focus').onclick=()=>{detail=!detail;frame()};
document.querySelector('#cutaway').onchange=e=>{for(const child of engine.children)if(child.isMesh)child.visible=!e.target.checked;};
let draws=0;model.traverse(o=>{if(o.isMesh)draws++});const bounds=new T.Box3().setFromObject(model,true);
document.querySelector('#stats').textContent=`${triangles(model).toLocaleString()} triangles · ${draws} model draws\n${bounds.getSize(new T.Vector3()).toArray().map(v=>(v*1000).toFixed(1)).join(' × ')} mm (X/Y/Z)\nDrag to orbit · wheel to zoom`;
window.legoQA={model,scene,renderer,camera,controls,errors,pose,CYCLE,triangles:triangles(model),draws};
let last=performance.now();renderer.setAnimationLoop(now=>{if(play)pose(theta+Math.min((now-last)/1000,.1)*2.2);last=now;controls.update();renderer.render(scene,camera);document.title='ready';});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script>
</html>
