<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>og</title>
<!-- Social card. Regenerate og.png (see README): the flow is a real frame from wake.js. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #07080a; color: #ecebe6; }
  canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .fade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,8,10,.96) 0%, rgba(7,8,10,.55) 44%, rgba(7,8,10,0) 70%); }
  .t { position: absolute; left: 64px; right: 64px; bottom: 54px; }
  .k { font: 500 15px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #a8abb1; }
  h1 { margin: 14px 0 0; font: 300 118px/.86 'Archivo', sans-serif; font-stretch: 125%; letter-spacing: -.025em; text-transform: uppercase; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 24px; }
  .l { margin: 0; font: 400 26px/1.3 'Archivo', sans-serif; max-width: 560px; }
  .l em, .l b { white-space: nowrap; }
  .l em { font-style: normal; color: #ff5b1f; } .l b { font-weight: 400; color: #4fb4ff; }
  .u { font: 500 15px/1.75 'JetBrains Mono', monospace; letter-spacing: .06em; color: #a8abb1; text-align: right; }
  .u span { color: #ecebe6; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="fade"></div>
  <div class="t">
    <div class="k">Mechanical Engineering · Purdue University · ’29</div>
    <h1>Nirav<br />Surabhi</h1>
    <div class="row">
      <p class="l">I design it, build it, measure it, and ship it — <em>in metal</em> and <b>in code</b>.</p>
      <div class="u">IEEE first author · FTC captain<br />Two apps on the App Store<br /><span>niravsurabhi.com</span></div>
    </div>
  </div>
  <script src="wake.js"></script>
  <script>
    // run the solver to a fully developed street, synchronously, then draw one frame
    var sim = new Wake(document.getElementById('c'), { mode: 0, cells: 90000, cyl: [0.12, 0.8], d: 0.14, re: 160 });
    var total = sim.warm + 9000; sim.warm = 0;
    for (var i = 0; i < total; i += 10) { for (var k = 0; k < 10; k++) sim._step(false); sim._dye(10); if (i % 2000 === 0) sim.gl.finish(); }
    sim._show(); sim.gl.finish();
  </script>
</body>
</html>
